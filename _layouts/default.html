<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% if page.url == "/" %}Maria Lobillo — Senior Backend Engineer{% else %}{{ page.title }} — Maria Lobillo{% endif %}</title>
  <meta name="description" content="{{ page.description | default: 'Senior backend engineer. I write about the backend systems I build and what I learn from them.' }}">
  <link rel="icon" href="/assets/img/favicon.ico">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="site-name" href="/">Maria Lobillo</a>
    <nav class="site-nav">
      <a href="/blog/"{% if page.url == "/blog/" %} aria-current="page"{% endif %}>Blog</a>
      <a href="/about/"{% if page.url == "/about/" %} aria-current="page"{% endif %}>About</a>
      <a href="https://github.com/marialobillo">GitHub ↗</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <span>© {{ 'now' | date: "%Y" }} Maria Lobillo</span>
    <nav>
      <a href="mailto:{{ site.email }}">Email</a>
      <a href="https://www.linkedin.com/in/maria-lobillo/">LinkedIn</a>
      <a href="https://github.com/marialobillo">GitHub</a>
    </nav>
  </footer>
</body>
</html>
