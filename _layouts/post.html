---
layout: default
---

<article>
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
      {% for tag in page.tags %}<span>#{{ tag }}</span>{% endfor %}
    </p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <footer class="post-footer">
    <a href="/blog/">← All posts</a>
  </footer>
</article>

<script>
  // Click an image in a post to see it full size. Click again or press Esc to close.
  document.addEventListener('click', function (e) {
    var img = e.target.closest('.post-content img');
    if (!img) return;
    var overlay = document.createElement('div');
    overlay.className = 'lightbox-overlay';
    var big = document.createElement('img');
    big.src = img.src;
    big.alt = img.alt;
    overlay.appendChild(big);
    overlay.addEventListener('click', function () { overlay.remove(); });
    document.body.appendChild(overlay);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      var o = document.querySelector('.lightbox-overlay');
      if (o) o.remove();
    }
  });
</script>
